name: Create Dev Build Artifact
on: push
jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Artifact
        run: ./gradlew build

      - name: Rename Artifact
        run: mv build/libs/duskthings-*.jar build/libs/duskthings-${{ github.sha }}.jar

      - uses: actions/upload-artifact@v7
        with:
          name: Dev Build Artifact (${{ github.sha }})
          path: build/libs/duskthings-${{ github.sha }}-dev.jar
