name: Create Dev Build Artifact
on:
  push:
    branches-ignore:
      - v*
jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Allow Executing gradlew
        run: chmod +x gradlew

      - name: Build Artifact
        run: ./gradlew build

      - name: Rename Artifact
        run: mv build/libs/dusksthings-*.jar build/libs/dusksthings-${{ github.sha }}.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dev Build Artifact (${{ github.sha }})
          path: build/libs/dusksthings-${{ github.sha }}.jar